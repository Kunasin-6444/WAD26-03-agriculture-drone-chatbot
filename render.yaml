# Render Blueprint: one free Docker web service for the LINE webhook (docs/DEPLOYMENT.md, section Render).
# Keys with sync: false are secrets: Render asks for them once when the Blueprint is created. Never put a
# secret value in this file (the repository may be public).
services:
  - type: web
    name: agri-drone-bot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    # Deploy with the Manual Deploy button until the 2 Nov submission; "commit" deploys on every push.
    autoDeployTrigger: "off"
    envVars:
      - key: HF_INDEX_REPO
        value: Kunasin/agri-drone-index
      - key: ANSWER_MODE
        value: natural
      - key: RAG_MODEL
        value: gpt-5.6-luna
      - key: LLM_FALLBACK_MODELS
        value: claude-sonnet-5.5,gemini-3.7-flash,deepseek-v4-pro
      - key: LLM_SECONDARY_ORDER
        value: last
      - key: LLM_SECONDARY_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_SECONDARY_REASONING_EFFORT
        value: low
      - key: LLM_SECONDARY_STRUCTURED_OUTPUT
        value: "true"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "6000"
      - key: LLM_ATTEMPT_TIMEOUT_SECONDS
        value: "35"
      - key: RAG_REQUEST_TIMEOUT_SECONDS
        value: "50"
      - key: KB_GENERATION_BUDGET_SECONDS
        value: "25"
      - key: HF_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_SECONDARY_BASE_URL
        sync: false
      - key: LLM_SECONDARY_API_KEY
        sync: false
