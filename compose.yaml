services:
  chatbot:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/chroma_db
      LINE_INBOX_DB_PATH: /app/cache/line_inbox.sqlite3
      # Require an explicit release profile; do not silently use legacy code defaults.
      ANSWER_MODE: ${ANSWER_MODE:?Set ANSWER_MODE in .env (see .env.example)}
      RAG_MODEL: ${RAG_MODEL:?Set RAG_MODEL in .env (see .env.example)}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS?Set LLM_FALLBACK_MODELS in .env (empty disables fallback)}
      LLM_SECONDARY_ORDER: ${LLM_SECONDARY_ORDER:?Set LLM_SECONDARY_ORDER in .env (last for current profile)}
      PDF_RETRIEVAL_MODE: ${PDF_RETRIEVAL_MODE:-text}
      RETRIEVER_RERANK: ${RETRIEVER_RERANK:-diverse}
      WARMUP_ON_STARTUP: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - knowledge:/app/chroma_db
      - state:/app/cache
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  knowledge:
  state:
